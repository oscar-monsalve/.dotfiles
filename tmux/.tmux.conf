# "C-a + r" to source the .tmux.conf file
bind r source-file ~/.tmux.conf

set-option -g default-terminal "tmux-256color"
set-option -g renumber-windows on
set -s escape-time 0

# Changed the default tmux leader key to C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Follow the terminal's Omarchy palette while keeping the classic bottom bar.
set -g status-position bottom
set -g status-style "bg=default,fg=blue"
setw -g window-status-current-style underscore

# Show copy mode, prefix waiting, and pane zoom before the title, time, and date.
set -g status-right-length 60
set -g status-right "#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=21:pane_title}\" %H:%M %d-%b-%y"

# Coordinate pane borders with the same palette.
setw -g pane-border-style "fg=brightblack"
setw -g pane-active-border-style "fg=blue"

# Match the session/window picker to the terminal palette.
setw -g tree-mode-selection-style "bg=blue,fg=black"
setw -g tree-mode-border-style "bg=default,fg=brightblack"
setw -g tree-mode-preview-style "fg=blue"

set -g base-index 1
set -g mouse on
unbind -T copy-mode-vi MouseDragEnd1Pane

# vim mode in terminal selection and config of selection and copying
set-window-option -g mode-keys vi
bind-key Space copy-mode  # Changed copy mode keybind from [ to <space>
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Keybind to attach sessions with tmux-sessionizer (<tmux-leader>+f) (https://github.com/edr3x/tmux-sessionizer)
bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

# Use curl to cheatsheet for programming languages or commands using tmux-sessionizer (<tmux-leader>+i)
bind-key -r i run-shell "tmux neww ~/.local/scripts/tmux-cht.sh"

# tmux-sessionizer change between sessions
bind-key -r j run-shell "~/.local/scripts/tmux-sessionizer ~/.local/share/omarchy"
bind-key -r k run-shell "~/.local/scripts/tmux-sessionizer ~/personal/coding/GCI"
bind-key -r l run-shell "~/.local/scripts/tmux-sessionizer ~/personal/coding/electric-machines"
bind-key -r m run-shell "~/.local/scripts/tmux-sessionizer ~/personal/coding/conductor-selector"
